name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "python/**", "mkdocs.yml", "tools/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # MkDocs 2 drops the plugin system that Material and mkdocstrings use.
          python -m pip install . matplotlib pandas "mkdocs<2" mkdocs-material "mkdocstrings[python]"
      - name: Gallery
        run: python tools/make_gallery.py
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    # GitHub Pages for private repositories needs a paid plan: until the
    # repository is public the site is only built (and kept as an artifact).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
