name: CI

on:
  push:
    # Not for tags (releases have their own workflow), nor for the maintainer
    # agent's branches: their pull requests run CI, and once is enough.
    branches: ["**", "!agent/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-matplotlib
            mingw-w64-ucrt-x86_64-python-pandas
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Engine tests (bit-identical to unmodified XPPAUT)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: PYTHONPATH=python/src python -m pytest -q python/tests
      - name: Desktop app starts, loads a model and renders
        run: |
          cd build/app
          ./xpplab.exe examples/lecar.ode --cmd "nullclines" --cmd "auto steady iapp" --screenshot shot.bmp --frames 10 || echo "exit code $?"
          cat shot.bmp.err 2>/dev/null || true
          test -s shot.bmp
      - name: A session saved as Python repeats it bit for bit
        run: python tests/replay.py --app build/app/xpplab.exe
      - name: If the app failed, show where (gdb)
        if: failure()
        run: |
          cd build/app
          gdb -batch -ex run -ex bt --args ./xpplab.exe examples/lecar.ode --screenshot dbg.bmp --frames 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview
          path: build/app/shot.bmp
          if-no-files-found: ignore

  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the reference build needs the import commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev ninja-build pkg-config
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install libx11 ninja pkg-config sdl3
      - name: Python packages
        # mcp: the MCP server's tests (python/tests/test_mcp.py), which are
        # skipped on Windows, where MSYS2 has no package for it. nbclient,
        # nbformat, ipykernel: the notebooks' test (python/tests/test_notebooks.py),
        # skipped where they are missing.
        run: python -m pip install numpy pytest matplotlib pandas mcp nbclient nbformat ipykernel
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Engine tests
        # The stored goldens were recorded with the Windows C runtime's maths
        # library; here the oracle is unmodified XPPAUT built on this machine.
        run: ctest --test-dir build --output-on-failure -E golden_examples
      - name: If an engine test crashed, show where (Linux, gdb)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          d=$(mktemp -d) && cp engine/xppaut/ode/lorenz.ode engine/xppaut/ode/lecar.ode "$d"
          cd "$d"
          for m in lorenz lecar; do
            gdb -batch -ex run -ex bt --args "$GITHUB_WORKSPACE/build/tests/api_smoke" $m.ode || true
          done
      - name: Build unmodified XPPAUT 8.0 with X11
        run: sh tests/build_reference.sh build-reference
      - name: Every example matches unmodified XPPAUT
        run: >-
          python tests/golden.py compare
          --exe build/cli/xppaut-headless
          --reference build-reference/xppaut-reference
      - name: Python tests
        run: PYTHONPATH=python/src python -m pytest -q python/tests
      - name: Desktop app starts and renders (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/app/xpplab.app/Contents/MacOS/xpplab
          test -x "$app"
          "$app" "$PWD/engine/xppaut/ode/lecar.ode" --cmd "nullclines" \
            --cmd "show phase" --screenshot "$PWD/macos-app.bmp" --frames 12 || true
          cat macos-app.bmp.err 2>/dev/null || true
          test -s macos-app.bmp
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: macos-preview
          path: |
            macos-app.bmp
            build/XPPLab-*.dmg
          if-no-files-found: ignore

  linux-app:
    name: Linux desktop app (SDL3 from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev             libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev             wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev xvfb
      - run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_TESTS=OFF -DXPPS_FETCH_SDL3=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target xpplab
      - name: The app starts under a virtual display and renders
        run: |
          cd build/app
          xvfb-run -a ./xpplab examples/lecar.ode --cmd "auto steady iapp" --screenshot shot.bmp --frames 10 || true
          cat shot.bmp.err 2>/dev/null || true
          test -s shot.bmp
      - name: If the app crashed, show where (gdb, valgrind)
        if: failure()
        run: |
          sudo apt-get install -y gdb valgrind
          cd build/app
          xvfb-run -a gdb -batch -ex run -ex bt --args ./xpplab examples/lecar.ode \
            --cmd "auto steady iapp" --screenshot "$PWD/dbg.bmp" --frames 10 || true
          xvfb-run -a valgrind --track-origins=yes --fullpath-after= --num-callers=30 \
            --log-file="$GITHUB_WORKSPACE/vg-app.log" ./xpplab examples/lecar.ode \
            --cmd "auto steady iapp" --screenshot "$PWD/vg.bmp" --frames 4 || true
          python3 "$GITHUB_WORKSPACE/tests/valgrind_report.py" "$GITHUB_WORKSPACE/vg-app.log"

  asan:
    name: Memory errors (AddressSanitizer)
    # glibc sometimes aborts with heap corruption that Windows does not
    # notice; AddressSanitizer reports the exact line of a bad access.
    if: vars.XPPS_LIGHT_CI != '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build with AddressSanitizer
        run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_APP=OFF \
                -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address \
                -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
          cmake --build build
      - name: API tests
        run: ctest --test-dir build --output-on-failure -E golden_examples
      - name: Every example model
        run: |
          d=$(mktemp -d)
          cp -r engine/xppaut/ode engine/xppaut/tstauto "$d/"
          bad=0
          for m in "$d"/ode/*.ode "$d"/tstauto/*.ode; do
            dir=$(dirname "$m")
            rc=0
            (cd "$dir" && timeout 300 "$GITHUB_WORKSPACE/build/cli/xppaut-headless" \
               "$(basename "$m")" -silent -outfile out.dat \
               </dev/null >out.txt 2>err.txt) || rc=$?
            if [ $rc -ge 124 ] || grep -q AddressSanitizer "$dir/err.txt"; then
              echo "::error::${m#$d/} (exit code $rc)"
              tail -n 60 "$dir/err.txt"; tail -n 5 "$dir/out.txt"; bad=1
            fi
          done
          exit $bad

  valgrind:
    name: Uninitialised memory (valgrind)
    # Reads of uninitialised memory can corrupt the heap at random; valgrind
    # reports them with the allocation they came from.
    if: vars.XPPS_LIGHT_CI != '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VG: valgrind --error-exitcode=0 --track-origins=yes --fullpath-after= --num-callers=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - run: python -m pip install numpy pytest matplotlib pandas
      - name: Build with debug information
        run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_APP=OFF -DCMAKE_C_FLAGS=-g
          cmake --build build
      - name: Engine API and AUTO under valgrind
        run: |
          d=$(mktemp -d)
          cp -r engine/xppaut/ode engine/xppaut/tstauto "$d/"
          for m in ode/lecar ode/lorenz ode/fhn tstauto/bob; do
            (cd "$d/$(dirname $m)" && $VG --log-file="$GITHUB_WORKSPACE/vg-$(basename $m).log" \
               "$GITHUB_WORKSPACE/build/tests/api_smoke" "$(basename $m).ode" >/dev/null) || true
          done
          (cd "$d/ode" && $VG --log-file="$GITHUB_WORKSPACE/vg-auto.log" \
             "$GITHUB_WORKSPACE/build/tests/auto_smoke" lecar.ode iapp hopf diagram.txt >/dev/null) || true
          # Valgrind found why mlvolt.ode used to differ between runs.
          (cd "$d/ode" && timeout 1200 $VG --log-file="$GITHUB_WORKSPACE/vg-mlvolt.log" \
             "$GITHUB_WORKSPACE/build/cli/xppaut-headless" mlvolt.ode -silent -outfile out.dat \
             </dev/null >/dev/null) || true
      - name: Python tests under valgrind
        # The MCP layer is pure Python over the calls tested here already.
        run: |
          PYTHONMALLOC=malloc PYTHONPATH=python/src $VG --log-file=vg-python.%p.log \
            python -m pytest -q python/tests --ignore=python/tests/test_mcp.py || true
      - name: Errors in XPP Lab code
        run: python tests/valgrind_report.py vg-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-logs
          path: vg-*.log
