name: CI

on:
  push:
    branches: ["**"] # not for tags: releases have their own workflow
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-matplotlib
            mingw-w64-ucrt-x86_64-python-pandas
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Engine tests (bit-identical to unmodified XPPAUT)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: PYTHONPATH=python/src python -m pytest -q python/tests
      - name: Desktop app starts, loads a model and renders
        run: |
          cd build/app
          ./xppstudio.exe examples/lecar.ode --cmd "nullclines" --cmd "auto steady iapp" --screenshot shot.bmp --frames 10 || echo "exit code $?"
          cat shot.bmp.err 2>/dev/null || true
          test -s shot.bmp
      - name: If the app failed, show where (gdb)
        if: failure()
        run: |
          cd build/app
          gdb -batch -ex run -ex bt --args ./xppstudio.exe examples/lecar.ode --screenshot dbg.bmp --frames 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview
          path: build/app/shot.bmp
          if-no-files-found: ignore

  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the reference build needs the import commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev ninja-build pkg-config
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install libx11 ninja pkg-config sdl3
      - name: Python packages
        run: python -m pip install numpy pytest matplotlib pandas
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Engine tests
        # The stored goldens were recorded with the Windows C runtime's maths
        # library; here the oracle is unmodified XPPAUT built on this machine.
        run: ctest --test-dir build --output-on-failure -E golden_examples
      - name: If an engine test crashed, show where (Linux, gdb)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          d=$(mktemp -d) && cp engine/xppaut/ode/lorenz.ode engine/xppaut/ode/lecar.ode "$d"
          cd "$d"
          for m in lorenz lecar; do
            gdb -batch -ex run -ex bt --args "$GITHUB_WORKSPACE/build/tests/api_smoke" $m.ode || true
          done
      - name: Build unmodified XPPAUT 8.0 with X11
        run: sh tests/build_reference.sh build-reference
      - name: Every example matches unmodified XPPAUT
        run: >-
          python tests/golden.py compare
          --exe build/cli/xppaut-headless
          --reference build-reference/xppaut-reference
      - name: Python tests
        run: PYTHONPATH=python/src python -m pytest -q python/tests
      - name: Desktop app starts and renders (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/app/xppstudio.app/Contents/MacOS/xppstudio
          test -x "$app"
          "$app" "$PWD/engine/xppaut/ode/lecar.ode" --cmd "nullclines" \
            --cmd "show phase" --screenshot "$PWD/macos-app.bmp" --frames 12 || true
          cat macos-app.bmp.err 2>/dev/null || true
          test -s macos-app.bmp
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && always()
        with:
          name: macos-preview
          path: |
            macos-app.bmp
            build/XPPStudio-*.dmg
          if-no-files-found: ignore

  linux-app:
    name: Linux desktop app (SDL3 from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev             libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev             wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev xvfb
      - run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_TESTS=OFF -DXPPS_FETCH_SDL3=ON
          cmake --build build --target xppstudio
      - name: The app starts under a virtual display and renders
        run: |
          cd build/app
          xvfb-run -a ./xppstudio examples/lecar.ode --cmd "auto steady iapp" --screenshot shot.bmp --frames 10 || true
          cat shot.bmp.err 2>/dev/null || true
          test -s shot.bmp

  asan:
    name: Memory errors (AddressSanitizer)
    # glibc sometimes aborts with heap corruption that Windows does not
    # notice; AddressSanitizer reports the exact line of a bad access.
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build with AddressSanitizer
        run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_APP=OFF \
                -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address \
                -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
          cmake --build build
      - name: API tests
        run: ctest --test-dir build --output-on-failure -E golden_examples
      - name: Every example model
        run: |
          d=$(mktemp -d)
          cp -r engine/xppaut/ode engine/xppaut/tstauto "$d/"
          bad=0
          for m in "$d"/ode/*.ode "$d"/tstauto/*.ode; do
            (cd "$(dirname "$m")" && timeout 300 "$GITHUB_WORKSPACE/build/cli/xppaut-headless" \
               "$(basename "$m")" -silent -outfile out.dat \
               </dev/null >/dev/null 2>err.txt)
            if grep -q AddressSanitizer "$(dirname "$m")/err.txt"; then
              echo "::error::${m#$d/}"; cat "$(dirname "$m")/err.txt"; bad=1
            fi
          done
          exit $bad

  wheels:
    name: Wheel (${{ matrix.os }})
    # Wheels take long (macOS minutes count tenfold on private repositories):
    # build them on request and for releases only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MinGW-w64 toolchain (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Put MinGW-w64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
      - name: Build wheels
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          # The wheel is py3-none-<platform>: one build serves every Python 3.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "universal2"
          CIBW_ENVIRONMENT_WINDOWS: CC=gcc CMAKE_GENERATOR=Ninja
          CIBW_TEST_REQUIRES: pytest matplotlib pandas
          CIBW_TEST_COMMAND: pytest -q {project}/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
