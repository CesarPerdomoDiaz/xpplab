      - Neuroscience: learn/neuroscience.md
      - Ecology: learn/ecology.md
      - Chemistry: learn/chemistry.md
      - Mechanics: learn/mechanics.md
      - Control: learn/control.md
      - "Aerospace: a kite on a tether": learn/kite.md
      - Gallery of classic models: gallery/index.md
