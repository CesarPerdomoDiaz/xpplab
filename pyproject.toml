[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "xpplab"
version = "0.1.3"
description = "XPPAUT's simulation and AUTO bifurcation engine for Python: pip install and go, no compiler, no X11"
readme = "python/README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "engine/xppaut/LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["xppaut", "auto", "bifurcation", "continuation", "dynamical systems",
            "ode", "neuroscience", "nonlinear dynamics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
pandas = ["pandas>=1.3"]
# The MCP server for coding agents: python -m xpplab.mcp (docs/agents.md).
mcp = ["mcp>=1.25", "matplotlib>=3.5"]
all = ["matplotlib>=3.5", "pandas>=1.3", "mcp>=1.25; python_version >= '3.10'"]
test = ["pytest>=7", "matplotlib>=3.5", "pandas>=1.3", "scipy>=1.7"]

[project.scripts]
xpplab-mcp = "xpplab.mcp:main"

[project.urls]
Homepage = "https://github.com/CesarPerdomoDiaz/xpplab"
Documentation = "https://cesarperdomodiaz.github.io/xpplab/"
Source = "https://github.com/CesarPerdomoDiaz/xpplab"
Issues = "https://github.com/CesarPerdomoDiaz/xpplab/issues"
Download = "https://github.com/CesarPerdomoDiaz/xpplab/releases/latest"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/src/xpplab"]
# The engine is loaded with ctypes and does not link against Python, so a
# single wheel per platform serves every Python 3 version.
wheel.py-api = "py3"
cmake.build-type = "Release"
build.targets = ["xppe"]
install.components = ["python"]
sdist.exclude = ["build*", "tests/golden", "docs/_build", ".github"]

[tool.scikit-build.cmake.define]
XPPS_BUILD_TESTS = "OFF"
XPPS_BUILD_CLI = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
