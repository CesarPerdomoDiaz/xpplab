  - Get started:
      - Install: install.md
      - Getting started with the app: manual/welcome.md
      - "Tutorial: your first model": manual/tutorial.md
      - Trying XPP Lab: testing.md
      - Coming from XPPAUT: manual/xppaut.md
      - Coming from MATLAB: manual/matlab.md
      - Coming from AUTO-07p: manual/auto07p.md
  - Desktop app:
      - "Tutorial: why does a neuron fire?": manual/neuron-tutorial.md
      - Bifurcation analysis with AUTO: manual/auto.md
      - Codimension-two bifurcations: manual/codim2.md
      - Data analysis: manual/analysis.md
      - Figures for papers: manual/figures.md
      - Initial values, Range, BVPs, 3D, Kinescope: manual/tools.md
  - Python:
      - Quick start: python/quickstart.md
      - Simulation: python/simulation.md
      - Phase plane: python/phase-plane.md
      - Bifurcations with AUTO: python/auto.md
      - Data analysis: python/analysis.md
      - Control design: python/control.md
      - Figures for papers: python/figures.md
      - Driving the desktop app: python/app.md
      - Coding agents: agents.md
  - Learn by example:
