site_name: XPP Lab
site_description: XPPAUT's engine with a modern interface and a Python package
site_url: https://cesarperdomodiaz.github.io/xpplab/
repo_url: https://github.com/CesarPerdomoDiaz/xpplab
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/xpplab.css

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            show_source: false
            docstring_style: google
            members_order: source
            show_root_heading: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true

