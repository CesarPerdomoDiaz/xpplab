name: Release

# Push a tag like v0.1.0 to build the desktop app for Windows, macOS and
# Linux, and attach them to a GitHub release. Run it by hand (workflow
# dispatch) to build the same packages as downloadable artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-python
      - run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_TESTS=OFF
          cmake --build build
          cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: build/XPPStudio-*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # A universal app (Apple Silicon and Intel). Homebrew's SDL3 is built
      # for one architecture only, so SDL3 is compiled from source here.
      - run: brew install ninja
      - run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_TESTS=OFF \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DXPPS_FETCH_SDL3=ON
          cmake --build build
          cd build && cpack
      - name: Check the packaged app (architectures, libraries, signature, start-up)
        run: |
          hdiutil attach build/XPPStudio-*.dmg -mountpoint /tmp/xpps -nobrowse -readonly
          bundle=$(ls -d /tmp/xpps/*.app | head -1)
          exe="$bundle/Contents/MacOS/$(defaults read "$bundle/Contents/Info" CFBundleExecutable)"
          echo "bundle: $bundle"
          lipo -archs "$exe"
          vtool -show-build "$exe" | grep -E "platform|minos" || true
          echo "libraries:" && otool -L "$exe"
          find "$bundle/Contents" -name "*.dylib" -exec sh -c 'echo "$1: $(lipo -archs "$1")"; otool -L "$1" | tail -n +2' _ {} \;
          codesign --verify --deep --strict --verbose=2 "$bundle"
          # Nothing may come from Homebrew or the build machine.
          if otool -L "$exe" $(find "$bundle/Contents" -name "*.dylib") | grep -E "/opt/homebrew|/usr/local|/Users/"; then
            echo "::error::the app links to libraries outside the bundle"; exit 1
          fi
          "$exe" "$PWD/engine/xppaut/ode/lecar.ode" --cmd "auto steady iapp" \
            --screenshot "$PWD/macos-release.bmp" --frames 10 || true
          cat macos-release.bmp.err 2>/dev/null || true
          test -s macos-release.bmp
          hdiutil detach /tmp/xpps
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            build/XPPStudio-*.dmg
            macos-release.bmp

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies for SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev
      - run: |
          cmake -S . -B build -G Ninja -DXPPS_BUILD_TESTS=OFF -DXPPS_FETCH_SDL3=ON
          cmake --build build
          cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: build/XPPStudio-*.tar.gz

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/XPPStudio-*
          generate_release_notes: true
